<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主车数据查看</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0a111c;color:#eef5fc;font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}main{max-width:1600px;margin:0 auto;padding:28px}a{color:#4bd7cd;text-decoration:none}a:hover{text-decoration:underline}h1{font-size:27px;margin:16px 0 8px}.note,#status{color:#98aabe}.toolbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:22px 0 14px}input{width:min(360px,100%);padding:10px 14px;background:#111d2c;border:1px solid #33465e;border-radius:8px;color:inherit;font:inherit}button{background:#173741;border:1px solid #397e85;border-radius:7px;padding:8px 16px;color:#dffaf7;cursor:pointer;font:inherit}button:disabled{opacity:.4;cursor:default}.table-wrap{max-height:70vh;overflow:auto;border:1px solid #26364a;border-radius:10px}table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;white-space:nowrap}th,td{padding:10px 14px;border-bottom:1px solid #26364a;text-align:right}th{position:sticky;top:0;background:#172538;z-index:1;text-align:left;font-weight:500}th small{display:block;color:#98aabe;font-size:11px}td{font-family:Consolas,monospace}tbody tr:nth-child(even){background:#101b29}tbody tr:hover{background:#18313d}.pager{display:flex;justify-content:flex-end;gap:16px;align-items:center;margin-top:16px}.error{color:#f2ae62}#empty{padding:25px;text-align:center;color:#98aabe}@media(max-width:600px){main{padding:16px}h1{font-size:23px}.pager{justify-content:space-between;gap:8px}}
</style></head>
<body><main><a id="back" href="index.html">← 返回汇报</a><h1 id="title">主车数据查看</h1><p class="note" id="description"></p>
<div class="toolbar"><input id="search" type="search" aria-label="搜索表格" placeholder="搜索时间或任意数值"><span id="status" role="status">正在读取数据…</span><a id="download" download hidden>下载此表</a></div>
<div class="table-wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table><div id="empty" hidden>没有匹配的记录</div></div>
<div class="pager"><button id="prev" disabled>上一页</button><span id="page">—</span><button id="next" disabled>下一页</button></div></main>
<script>
const names=__SCENE_NAMES__;
const fields={t:'回放时间 / s',speed_kmh:'速度 / km/h',acceleration_m_s2:'纵向加速度 / m/s²',distance_m:'累计路程 / m',related_center_distance_m:'事故目标中心距离 / m',x:'X / m',y:'Y / m',replay_time_s:'回放时间 / s',carla_frame:'CARLA 帧号',snapshot_frame:'快照帧号',ground_x:'地面中心 X / m',ground_y:'地面中心 Y / m',ground_z:'地面中心 Z / m',yaw_carla_deg:'实际偏航角 / °',commanded_yaw_deg:'指令偏航角 / °',yaw_rate_deg_s:'偏航角速度 / °/s',chase_camera_yaw_deg:'跟随相机偏航角 / °',commanded_speed_m_s:'指令速度 / m/s',position_derived_speed_m_s:'位移推导速度 / m/s',origin_error_m:'执行位置误差 / m'};
const el=id=>document.getElementById(id);let rows=[],filtered=[],page=0;const pageSize=100;
function parseCsv(text){const result=[];let row=[],cell='',quoted=false;text=text.replace(/^\uFEFF/,'');for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x!==''))result.push(row);row=[];cell='';}else cell+=c;}if(cell||row.length){row.push(cell);result.push(row);}return result;}
function render(){const pages=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.max(0,Math.min(page,pages-1));const frag=document.createDocumentFragment();for(const row of filtered.slice(page*pageSize,(page+1)*pageSize)){const tr=document.createElement('tr');for(const value of row){const td=document.createElement('td');td.textContent=value||'—';tr.append(td);}frag.append(tr);}el('body').replaceChildren(frag);el('status').textContent=`共 ${rows.length} 行 · 匹配 ${filtered.length} 行`;el('empty').hidden=filtered.length>0;el('page').textContent=`${page+1} / ${pages} 页`;el('prev').disabled=page===0;el('next').disabled=page>=pages-1;}
el('search').oninput=()=>{const query=el('search').value.trim().toLowerCase();filtered=rows.filter(row=>row.some(value=>value.toLowerCase().includes(query)));page=0;render();};el('prev').onclick=()=>{page--;render();};el('next').onclick=()=>{page++;render();};
(async()=>{try{const params=new URLSearchParams(location.search),scene=params.get('scene'),type=params.get('type');if(!Object.prototype.hasOwnProperty.call(names,scene)||!['analysis','telemetry'].includes(type))throw Error('场景或表格类型无效，请从报告中的“查看”入口打开。');const label=type==='analysis'?'主车分析 CSV':'CARLA 主车位姿 CSV';el('title').textContent=`${names[scene]} · ${label}`;document.title=el('title').textContent;el('back').href=`index.html#${scene}`;el('description').textContent=type==='analysis'?'分析由重建轨迹推导；加速度采用 1.0 秒窗口平滑，非实车 CAN / IMU 测量。表格保留 CSV 原始数值。':'数据来自 CARLA 帧同步位姿记录；位置误差表示回放执行一致性，不代表真实事故重建误差。表格保留 CSV 原始数值。';const path=`${scene}/${type==='analysis'?'analysis/ego_metrics.csv':'validation/carla_imported/ego_telemetry.csv'}`;const response=await fetch(path);if(!response.ok)throw Error(`读取失败（HTTP ${response.status}）`);const parsed=parseCsv(await response.text());if(!parsed.length)throw Error('表格为空');const headers=parsed.shift();const tr=document.createElement('tr');for(const name of headers){const th=document.createElement('th');th.scope='col';th.textContent=fields[name]||name;const small=document.createElement('small');small.textContent=name;th.append(small);tr.append(th);}el('head').append(tr);rows=parsed;filtered=rows;el('download').href=path;el('download').hidden=false;render();}catch(error){el('status').textContent=error.message;el('status').classList.add('error');el('search').disabled=true;}})();
</script></body></html>
